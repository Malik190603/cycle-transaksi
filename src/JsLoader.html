<script>
// =========================================================================
// JsLoader.html (v8.27)
// Modul loader global -- dipakai di 3 titik sesuai permintaan:
//   1. showSpinnerOverlay_() / hideSpinnerOverlay_()  -> Login Screen
//   2. showPulseOverlay_()   / hidePulseOverlay_()    -> Submit Count
//   3. showTopLoadingBar_()  / hideTopLoadingBar_()   -> Pergantian Facility
// Semua warna ikut var(--loader-color) (biru light mode / ungu dark mode,
// lihat Style.html), sudah otomatis ganti tanpa perlu sentuh JS ini.
//
// Fitur bersama:
// - teks info bisa diisi custom, default disediakan per fungsi
// - overlay blocking click supaya user tidak bisa tap berkali-kali
// - auto hilang begitu proses selesai (dipanggil manual di success/failure handler)
// - kalau proses ternyata lama, teks di-update otomatis (bukan diam saja tanpa perubahan) supaya user tahu app masih jalan, bukan macet
// =========================================================================

var LOADER_UPDATE_MS_1 = 6000;  // jeda sebelum update teks pertama
var LOADER_UPDATE_MS_2 = 14000; // jeda sebelum update teks kedua (lebih lama lagi)
var loaderTimers_ = { t1: null, t2: null };

function clearLoaderTimers_() {
  if (loaderTimers_.t1) { clearTimeout(loaderTimers_.t1); loaderTimers_.t1 = null; }
  if (loaderTimers_.t2) { clearTimeout(loaderTimers_.t2); loaderTimers_.t2 = null; }
}

// textEl: elemen teks yang di-update, baseText: teks awal (dipakai di update pertama)
function scheduleLoaderTextUpdate_(textEl) {
  clearLoaderTimers_();
  if (!textEl) return;
  loaderTimers_.t1 = setTimeout(function () {
    textEl.textContent = 'Masih diproses, mohon tunggu...';
  }, LOADER_UPDATE_MS_1);
  loaderTimers_.t2 = setTimeout(function () {
    textEl.textContent = 'Ini memakan waktu lebih lama dari biasanya, mohon tunggu sebentar lagi...';
  }, LOADER_UPDATE_MS_2);
}

// ---------- 1) Spinning Loader (Login) ----------
function showSpinnerOverlay_(text) {
  var overlay = el('spinnerOverlay');
  var textEl = el('spinnerOverlayText');
  if (!overlay) return;
  if (textEl) textEl.textContent = text || 'Memeriksa akun...';
  overlay.classList.add('active');
  scheduleLoaderTextUpdate_(textEl);
}

function hideSpinnerOverlay_() {
  var overlay = el('spinnerOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  clearLoaderTimers_();
}

// ---------- 2) Pulsing Loader (Submit Count) ----------
function showPulseOverlay_(text) {
  var overlay = el('pulseOverlay');
  var textEl = el('pulseOverlayText');
  if (!overlay) return;
  if (textEl) textEl.textContent = text || 'Menyimpan hasil hitung...';
  overlay.classList.add('active');
  scheduleLoaderTextUpdate_(textEl);
}

function hidePulseOverlay_() {
  var overlay = el('pulseOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  clearLoaderTimers_();
}

// ---------- 3) Thin Top Loading Bar (Pergantian Facility) ----------
var topBarHideTimer_ = null;

function showTopLoadingBar_(text) {
  var bar = el('topLoadingBar');
  var label = el('topLoadingBarText');
  var blockOverlay = el('topBarOverlay');
  if (!bar) return;
  if (topBarHideTimer_) { clearTimeout(topBarHideTimer_); topBarHideTimer_ = null; }
  bar.classList.remove('done');
  bar.classList.add('active');
  if (blockOverlay) blockOverlay.classList.add('active'); // blokir klik ke menu lain selagi pindah facility
  if (label) {
    label.textContent = text || 'Mengambil data facility...';
    label.classList.add('active');
    scheduleLoaderTextUpdate_(label);
  }
}

function hideTopLoadingBar_() {
  var bar = el('topLoadingBar');
  var label = el('topLoadingBarText');
  var blockOverlay = el('topBarOverlay');
  if (!bar) return;
  clearLoaderTimers_();
  // Bar "melesat" ke 100% dulu sekilas (kesan selesai) baru fade out semuanya --
  // supaya tidak terasa terpotong tiba-tiba di tengah animasi.
  bar.classList.add('done');
  topBarHideTimer_ = setTimeout(function () {
    bar.classList.remove('active', 'done');
    if (label) label.classList.remove('active');
    if (blockOverlay) blockOverlay.classList.remove('active');
  }, 260);
}

// ---------- 4) Circular Progress Ring (Import Data & Facility Management) ----------
// Beda dari 3 loader di atas: ring ini menampilkan PERSENTASE ASLI dari proses backend,
// bukan cuma indikator "lagi jalan". Backend melapor progress lewat CacheService
// (lihat reportProgress_() di Utils.gs) di titik-titik checkpoint proses -- client
// polling ringan tiap 700ms ke getImportProgress(jobId) untuk ambil angka terakhir.
// Ini murni tambahan instrumentasi -- tidak mengubah hasil/logic proses utama sama sekali.
var RING_CIRCUMFERENCE_ = 2 * Math.PI * 28; // r=28 (lihat Style.html .loader-ring-track)
var ringPollTimer_ = null;
var ringLastPercent_ = -1;
var ringStallCount_ = 0;

function showRingOverlay_(text) {
  var overlay = el('ringOverlay');
  var textEl = el('ringOverlayText');
  var circle = el('ringProgressCircle');
  var pctEl = el('ringOverlayPct');
  if (!overlay) return;
  if (textEl) textEl.textContent = text || 'Memproses...';
  if (circle) {
    circle.style.strokeDasharray = RING_CIRCUMFERENCE_;
    circle.style.strokeDashoffset = RING_CIRCUMFERENCE_;
  }
  if (pctEl) pctEl.textContent = '0%';
  ringLastPercent_ = -1;
  ringStallCount_ = 0;
  overlay.classList.add('active');
}

function updateRingProgress_(percent, label, baseText) {
  var circle = el('ringProgressCircle');
  var pctEl = el('ringOverlayPct');
  var textEl = el('ringOverlayText');
  var p = Math.max(0, Math.min(100, Number(percent) || 0));
  if (circle) circle.style.strokeDashoffset = RING_CIRCUMFERENCE_ * (1 - p / 100);
  if (pctEl) pctEl.textContent = Math.round(p) + '%';

  // Kalau progress tidak berubah selama beberapa kali polling berturut-turut, tampilkan
  // pesan supaya user tahu app masih jalan (bukan macet) -- sama seperti loader lain.
  if (p === ringLastPercent_) {
    ringStallCount_++;
  } else {
    ringStallCount_ = 0;
    ringLastPercent_ = p;
  }
  if (textEl) {
    if (ringStallCount_ >= 8) {
      textEl.textContent = 'Masih diproses, mohon tunggu...';
    } else if (label) {
      textEl.textContent = (baseText ? baseText + ' - ' : '') + label;
    } else if (baseText) {
      textEl.textContent = baseText;
    }
  }
}

function hideRingOverlay_() {
  var overlay = el('ringOverlay');
  if (!overlay) return;
  // Loncat ke 100% sekilas dulu supaya kesan 'selesai' jelas, baru overlay ditutup.
  updateRingProgress_(100, null, null);
  stopRingPolling_();
  setTimeout(function () { overlay.classList.remove('active'); }, 200);
}

// jobId: string unik per proses (bikin dengan makeJobId_()).
// getterFnName: nama fungsi Apps Script yang menerima jobId & mengembalikan {percent, label}, mis. 'getImportProgress'.
function startRingPolling_(jobId, getterFnName, baseText) {
  stopRingPolling_();
  ringPollTimer_ = setInterval(function () {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res) return;
        updateRingProgress_(res.percent, res.label, baseText);
      })
      .withFailureHandler(function () { /* diamkan, biarkan ring tetap di progress terakhir */ })
      [getterFnName](jobId);
  }, 700);
}

function stopRingPolling_() {
  if (ringPollTimer_) { clearInterval(ringPollTimer_); ringPollTimer_ = null; }
}

function makeJobId_() {
  return 'job_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
}
</script>
