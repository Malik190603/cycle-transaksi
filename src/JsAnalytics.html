<script>
// ---------- Analytics: Accuracy Root Cause ----------
// Beda dari Dashboard (JsDashboard.html) -- layar ini fokus ke ROOT
// CAUSE discrepancy
// (bukan leaderboard akurasi per periode). Rentang tanggal bebas (bukan
// daily/monthly).

const AN_ROOT_CAUSE_COLOR_ = {
  'Salah Picking / Move': '#E74C3C',
  'Salah Putaway': '#F39C12',
  'Human Error Cycle': '#F1C40F',
  'Master Data / Location': '#3498DB',
  'Tidak diketahui': '#95A5A6'
};

const AN_ACTION_LOOKUP_ = {
  'Salah Picking / Move': { icon: '👤', title: 'Coaching User', desc: 'Lakukan coaching untuk user cycle dengan error picking/move tertinggi.' },
  'Salah Putaway': { icon: '📦', title: 'Review Proses Putaway', desc: 'Cek proses putaway & penempatan barang di lokasi yang sering bermasalah.' },
  'Human Error Cycle': { icon: '📝', title: 'Review Proses Cycle Count', desc: 'Cek ulang proses hitung & training user cycle terkait ketelitian.' },
  'Master Data / Location': { icon: '🛠️', title: 'Perbaikan Master Data', desc: 'Cek dan perbaiki master data / mapping lokasi yang tidak sesuai.' },
  'Tidak diketahui': { icon: '🔍', title: 'Investigasi Lanjutan', desc: 'Tindak lanjuti task yang masih belum punya kategori penyebab jelas.' }
};

let anData_ = null;
let anContribMode_ = 'userCycle';
let anActiveRootCause_ = null;
let anDetailFull_ = [];
let anDetailShown_ = 0;
const AN_DETAIL_PAGE_SIZE_ = 8;

function bukaAnalytics() {
  if (!requireLogin_(['admin'])) return;
  const today = new Date();
  const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const weekAgo = new Date(today.getTime() - 6 * 86400000);
  const isoFrom = weekAgo.getFullYear() + '-' + String(weekAgo.getMonth() + 1).padStart(2, '0') + '-' + String(weekAgo.getDate()).padStart(2, '0');
  if (!el('anDateFrom').value) el('anDateFrom').value = isoFrom;
  if (!el('anDateTo').value) el('anDateTo').value = iso;
  showScreen('screenAnalytics');
  loadAnalytics_();
}

function toggleAnFilterCollapse_() {
  const toolbar = el('anToolbar');
  const btn = el('btnAnFilterCollapse');
  const collapsed = toolbar.classList.toggle('filter-collapsed');
  btn.textContent = collapsed ? '▼' : '▲';
}

function loadAnalytics_() {
  const dateFrom = el('anDateFrom').value;
  const dateTo = el('anDateTo').value;
  if (!dateFrom || !dateTo) return;

  el('btnAnFilter').disabled = true;
  el('btnAnFilter').textContent = 'Memuat...';
  el('anEmpty').textContent = '';
  el('anContent').classList.add('hidden');

  google.script.run
    .withSuccessHandler(function (res) {
      el('btnAnFilter').disabled = false;
      el('btnAnFilter').textContent = '🔍 Filter';
      anData_ = res;
      if (!res || !res.kpi || !res.kpi.total) {
        el('anEmpty').textContent = 'Tidak ada data cycle count pada rentang tanggal ini.';
        return;
      }
      el('anContent').classList.remove('hidden');
      renderAnOverview_(res);
      renderAnRootCause_(res);
      anContribMode_ = 'userCycle';
      setContribTab_('userCycle');
      renderAnActions_(res);
      anActiveRootCause_ = null;
      el('rcDetailTableWrap').classList.add('hidden');
      el('rcDetailEmpty').textContent = 'Klik salah satu penyebab di atas untuk melihat detail.';
      el('btnRcShowMore').classList.add('hidden');
    })
    .withFailureHandler(function (err) {
      el('btnAnFilter').disabled = false;
      el('btnAnFilter').textContent = '🔍 Filter';
      onServerError_(err);
    })
    .getAnalyticsRootCauseData(dateFrom, dateTo, currentUser.username);
}

function renderAnOverview_(res) {
  el('anAccuracy').textContent = res.kpi.akurasi + '%';
  el('anError').textContent = res.kpi.errorPersen + '%';
  el('anErrorSub').textContent = res.kpi.discrepancy + ' SKU discrepancy';
  el('anTotalDiscrepancy').textContent = res.kpi.discrepancy;
  el('anTrendSubtitle').textContent = res.trend.length + ' hari dalam rentang terpilih';
  renderAnTrendChart_(res.trend);
}

function formatAnTrendLabel_(tgl) {
  const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const parts = tgl.split('-');
  return parseInt(parts[2], 10) + '/' + parseInt(parts[1], 10);
}

function renderAnTrendChart_(list) {
  const svg = el('anTrendSvg');
  if (!list || !list.length) { svg.innerHTML = ''; return; }

  const wrap = el('anTrendChartWrap');
  const W = Math.max(wrap.clientWidth || 0, 320);
  const H = 150;
  const x0 = 32, x1 = W - 12, y0 = 14, y1 = H - 24;
  const n = list.length;
  const colW = n > 1 ? (x1 - x0) / (n - 1) : 0;

  function cx(i) { return n > 1 ? x0 + colW * i : (x0 + x1) / 2; }
  function cy(akurasi) { return y1 - (akurasi / 100) * (y1 - y0); }

  let gridHtml = '';
  [0, 50, 100].forEach(function (pct) {
    const gy = cy(pct);
    gridHtml += '<line x1="' + x0 + '" y1="' + gy + '" x2="' + x1 + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3" /><text x="2" y="' + (gy + 3) + '" font-size="8" fill="var(--text-secondary)">' + pct + '%</text>';
  });

  let pathD = '';
  let dotsHtml = '';
  let labelsHtml = '';
  list.forEach(function (p, i) {
    const x = cx(i), y = cy(p.akurasi);
    pathD += (i === 0 ? 'M ' : ' L ') + x + ' ' + y;
    dotsHtml += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="#34C759"></circle>';
    if (n <= 10 || i % Math.ceil(n / 10) === 0) {
      labelsHtml += '<text x="' + x + '" y="' + (H - 6) + '" font-size="8" fill="var(--text-secondary)" text-anchor="middle">' + formatAnTrendLabel_(p.tanggal) + '</text>';
    }
  });

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = gridHtml + '<path d="' + pathD + '" fill="none" stroke="#34C759" stroke-width="2.5" />' + dotsHtml + labelsHtml;
}

function renderAnRootCause_(res) {
  const list = res.rootCause || [];
  const total = res.kpi.discrepancy;
  el('rcDonutTotal').textContent = total;

  let gradParts = [];
  let acc = 0;
  list.forEach(function (r) {
    if (!r.jumlah) return;
    const color = AN_ROOT_CAUSE_COLOR_[r.label] || '#95A5A6';
    const start = acc;
    acc += r.persen;
    gradParts.push(color + ' ' + start + '% ' + acc + '%');
  });
  el('rcDonut').style.background = gradParts.length ? 'conic-gradient(' + gradParts.join(', ') + ')' : 'var(--border)';

  const legendEl = el('rcLegend');
  legendEl.innerHTML = '';
  const chipRow = el('rcChipRow');
  chipRow.innerHTML = '';

  list.forEach(function (r) {
    const color = AN_ROOT_CAUSE_COLOR_[r.label] || '#95A5A6';

    const item = document.createElement('div');
    item.className = 'rc-legend-item';
    item.innerHTML =
      '<span class="rc-legend-dot" style="background: ' + color + ';"></span>' +
      '<span class="rc-legend-label">' + escapeHtml(r.label) + '</span>' +
      '<span class="rc-legend-count">' + r.jumlah + '</span>' +
      '<span class="rc-legend-pct" style="color: ' + color + ';">' + r.persen + '%</span>';
    item.addEventListener('click', function () { openAnRootCauseDetail_(r.label); });
    legendEl.appendChild(item);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'rc-chip';
    chip.style.color = color;
    chip.id = 'rcChip_' + r.label.replace(/[^a-zA-Z0-9]/g, '_');
    chip.textContent = r.label + ' (' + r.jumlah + ')';
    chip.addEventListener('click', function () { openAnRootCauseDetail_(r.label); });
    chipRow.appendChild(chip);
  });
}

function setContribTab_(mode) {
  anContribMode_ = mode;
  el('contribTabUserCycle').className = mode === 'userCycle' ? 'contrib-tab active' : 'contrib-tab';
  el('contribTabValidator').className = mode === 'validator' ? 'contrib-tab active' : 'contrib-tab';
  el('contribTabOperasional').className = mode === 'operasional' ? 'contrib-tab active' : 'contrib-tab';
  renderAnContrib_();
}

function renderAnContrib_() {
  if (!anData_) return;
  const list = (anData_.contributors && anData_.contributors[anContribMode_]) || [];
  const listEl = el('contribList');
  listEl.innerHTML = '';
  if (!list.length) {
    el('contribEmpty').textContent = 'Belum ada data pada rentang ini.';
    return;
  }
  el('contribEmpty').textContent = '';
  const maxJumlah = Math.max.apply(null, list.map(function (x) { return x.jumlah; }));
  list.forEach(function (c, i) {
    const row = document.createElement('div');
    row.className = 'contrib-row';
    const barPct = maxJumlah ? Math.round((c.jumlah / maxJumlah) * 100) : 0;
    row.innerHTML =
      '<span class="contrib-rank">' + (i + 1) + '</span>' +
      '<span class="contrib-name" title="' + escapeHtml(c.nama) + '">' + escapeHtml(c.nama) + '</span>' +
      '<span class="contrib-bar-bg"><span class="contrib-bar-fill" style="width: ' + barPct + '%;"></span></span>' +
      '<span class="contrib-count">' + c.jumlah + ' ERROR (' + c.persen + '%)</span>';
    listEl.appendChild(row);
  });
}

function openAnRootCauseDetail_(label) {
  anActiveRootCause_ = label;
  document.querySelectorAll('.rc-chip').forEach(function (c) { c.classList.remove('active'); });
  const chipEl = el('rcChip_' + label.replace(/[^a-zA-Z0-9]/g, '_'));
  if (chipEl) chipEl.classList.add('active');

  const dateFrom = el('anDateFrom').value, dateTo = el('anDateTo').value;
  el('rcDetailLoading').textContent = 'Memuat detail...';
  el('rcDetailTableWrap').classList.add('hidden');
  el('rcDetailEmpty').textContent = '';
  el('btnRcShowMore').classList.add('hidden');

  google.script.run
    .withSuccessHandler(function (rows) {
      el('rcDetailLoading').textContent = '';
      anDetailFull_ = rows || [];
      anDetailShown_ = 0;
      if (!anDetailFull_.length) {
        el('rcDetailEmpty').textContent = 'Tidak ada item untuk penyebab ini pada rentang tanggal ini.';
        return;
      }
      el('rcDetailTableWrap').classList.remove('hidden');
      rcRenderDetailRows_();
    })
    .withFailureHandler(function (err) {
      el('rcDetailLoading').textContent = '';
      onServerError_(err);
    })
    .getAnalyticsRootCauseDetail(label, dateFrom, dateTo, currentUser.username);
}

function rcRenderDetailRows_() {
  const tbody = el('rcDetailTableBody');
  if (anDetailShown_ === 0) tbody.innerHTML = '';
  const nextChunk = anDetailFull_.slice(anDetailShown_, anDetailShown_ + AN_DETAIL_PAGE_SIZE_);
  nextChunk.forEach(function (d) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + escapeHtml(d.sku) + '</td>' +
      '<td>' + escapeHtml(d.description) + '</td>' +
      '<td>' + escapeHtml(d.lokasi) + '</td>' +
      '<td>' + d.qtyError + '</td>' +
      '<td>' + escapeHtml(d.userCycle) + '</td>' +
      '<td>' + escapeHtml(d.validator) + '</td>' +
      '<td>' + escapeHtml(d.wmsUser) + '</td>' +
      '<td>' + escapeHtml(d.transaksi) + '</td>' +
      '<td>' + escapeHtml(d.tanggal) + '</td>' +
      '<td>' + escapeHtml(d.hasilInvestigasi || '-') + '</td>';
    tbody.appendChild(tr);
  });
  anDetailShown_ += nextChunk.length;
  el('btnRcShowMore').classList.toggle('hidden', anDetailShown_ >= anDetailFull_.length);
}

function rcShowMore_() { rcRenderDetailRows_(); }

function renderAnActions_(res) {
  const list = (res.rootCause || []).slice().sort(function (a, b) { return b.jumlah - a.jumlah; });
  const top = list.length ? list[0] : null;
  const listEl = el('anActionList');
  listEl.innerHTML = '';

  // Aksi untuk top 2 root cause yang punya data (paling relevan) + 1 aksi monitoring umum.
  const withData = list.filter(function (r) { return r.jumlah > 0; }).slice(0, 2);
  withData.forEach(function (r) {
    const act = AN_ACTION_LOOKUP_[r.label];
    if (!act) return;
    const card = document.createElement('div');
    card.className = 'an-action-card';
    card.innerHTML =
      '<span class="an-action-icon">' + act.icon + '</span>' +
      '<div><div class="an-action-title">' + escapeHtml(act.title) + '</div>' +
      '<div class="an-action-desc">' + escapeHtml(act.desc) + '</div></div>';
    listEl.appendChild(card);
  });

  const monitorCard = document.createElement('div');
  monitorCard.className = 'an-action-card';
  monitorCard.innerHTML =
    '<span class="an-action-icon">📊</span>' +
    '<div><div class="an-action-title">Monitoring Ketat</div>' +
    '<div class="an-action-desc">Tingkatkan monitoring akurasi di area/lokasi yang paling sering bermasalah.</div></div>';
  listEl.appendChild(monitorCard);

  const insightEl = el('anInsightBox');
  if (top && top.jumlah > 0) {
    insightEl.textContent = '💡 ' + top.persen + '% error disebabkan oleh ' + top.label + '. Fokus perbaikan pada area ini.';
  } else {
    insightEl.textContent = '💡 Tidak ada discrepancy pada rentang tanggal ini.';
  }
}
</script>
